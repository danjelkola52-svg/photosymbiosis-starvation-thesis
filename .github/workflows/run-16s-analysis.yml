name: Reproduce thesis analyses (R)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_DADA2: "false"
      THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install CRAN dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          install.packages(c(
            "readxl", "dplyr", "tidyr", "purrr", "tibble", "stringr",
            "readr", "ggplot2", "patchwork", "car", "openxlsx",
            "vegan", "ggrepel", "ragg", "BiocManager"
          ))

      - name: Install Bioconductor dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages("BiocManager")
          }

          BiocManager::install(
            c("phyloseq", "ANCOMBC", "ALDEx2"),
            ask = FALSE,
            update = FALSE
          )

          required <- c("phyloseq", "ANCOMBC", "ALDEx2", "ragg")
          missing <- required[!vapply(
            required,
            requireNamespace,
            quietly = TRUE,
            FUN.VALUE = logical(1)
          )]

          if (length(missing) > 0) {
            stop(
              "Packages still missing: ",
              paste(missing, collapse = ", ")
            )
          }

          message("All required packages are installed.")

      - name: Verify saved phyloseq input exists
        run: |
          test -s 16S/dada2_out/ps_raw.rds || {
            echo "::error::16S/dada2_out/ps_raw.rds is missing. This workflow skips raw-read DADA2 processing."
            exit 1
          }

      - name: Run physiology analysis
        run: Rscript scripts/physiology_analysis.R

      - name: Run 16S analysis
        run: Rscript scripts/16S_amplicon_analysis.R

      - name: Run Figure 12 and full ANCOM-BC2 tables
        run: Rscript scripts/16S_figure12_and_ancombc2_tables.R

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-analysis-results
          path: |
            results/physiology/
            16S/tables/
            16S/figures/
          if-no-files-found: warn
          retention-days: 14
