name: Run 16S R analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_DADA2: "false"
      THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install CRAN dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::stringr
            any::readr
            any::ggplot2
            any::patchwork
            any::car
            any::openxlsx
            any::vegan
            any::ggrepel
            any::ragg
            any::decontam
            any::BiocManager

      - name: Install Bioconductor dependencies
        shell: Rscript {0}
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          BiocManager::install(c("dada2", "phyloseq", "Biostrings", "ShortRead", "ANCOMBC", "decontam"),
                              ask = FALSE, update = FALSE)

      - name: Verify saved phyloseq input exists
        run: |
          test -s 16S/dada2_out/ps_raw.rds || {
            echo "::error::16S/dada2_out/ps_raw.rds is missing. This workflow skips raw-read DADA2 processing."
            exit 1
          }

      - name: Run 16S analysis
        run: Rscript scripts/16S_amplicon_analysis.R

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 16S-analysis-results
          path: |
            16S/tables/
            16S/figures/
            16S/dada2_out/
          if-no-files-found: warn
          retention-days: 14
